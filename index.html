<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>탄생화 · 탄생석 카드 메이커</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<style>
  @font-face{
    font-family:'GmarketSansMedium';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/GmarketSansMedium.woff') format('woff');
    font-weight:500; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'GmarketSansBold';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/GmarketSansBold.woff') format('woff');
    font-weight:700; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Paperlogy';
    src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Paperlogy';
    src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
    font-weight:600; font-style:normal; font-display:swap;
  }

  :root{
    --font-main:'Pretendard', sans-serif;
    --font-serif:'Noto Serif KR', serif;

    --ui-bg:#F5F4F1;
    --ui-panel:#FFFFFF;
    --ui-border:#E4E1D9;
    --ui-text:#2A2823;
    --ui-text-soft:#8A867C;
    --shell-accent:#3E5C8A;

    --paper:#FBF6EC;
    --paper-deep:#F1E9D8;
    --ink:#2E2B22;
    --ink-soft:#5B5648;
    --hairline: rgba(46,43,34,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-main);
    color:var(--ui-text);
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 12% 0%, rgba(255,255,255,0.10), transparent 55%),
      linear-gradient(160deg, #4C6DA0 0%, #33487A 55%, #2A3B66 100%);
    display:flex;
    padding:22px;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- 앱 쉘 (플레이리스트 느낌: 짙은 배경 + 둥근 흰 패널) ---------- */
  .app-shell{
    flex:1;
    min-width:0;
    background:var(--ui-panel);
    border-radius:28px;
    box-shadow:0 30px 70px rgba(10,18,40,0.38);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- 상단 바 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;
    height:56px;
    background:var(--ui-panel);
    border-bottom:1px solid var(--ui-border);
    flex:none;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-title{font-size:13.5px;color:var(--ui-text-soft);font-weight:600;}
  .topbar-right{display:flex;gap:8px;}
  .btn{
    font-family:var(--font-main);
    font-size:13px;
    border:1px solid var(--ui-border);
    background:var(--ui-panel);
    color:var(--ui-text);
    padding:9px 15px;
    border-radius:11px;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    transition:background 0.15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover{background:#F0EFEA;}
  .btn:active{transform:scale(0.97);}
  .btn.primary{
    background:var(--shell-accent);
    border-color:var(--shell-accent);
    color:#fff;
  }
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:0.5;cursor:default;}

  /* ---------- 레이아웃 ---------- */
  .app{
    flex:1;
    display:flex;
    min-height:0;
  }

  .sidebar{
    width:330px;
    flex:none;
    background:var(--ui-panel);
    border-right:1px solid var(--ui-border);
    overflow-y:auto;
    padding:18px 18px 60px;
  }

  .section{
    border-bottom:1px solid var(--ui-border);
    padding:16px 0;
  }
  .section:first-child{padding-top:0;}
  .section-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--ui-text);
    margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .section-title .count{
    font-weight:500;color:var(--ui-text-soft);font-size:11px;
  }

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field-label{
    display:block;
    font-size:12px;
    color:var(--ui-text-soft);
    margin-bottom:6px;
  }
  .field input[type=text], .field textarea, .field select{
    width:100%;
    font-family:var(--font-main);
    font-size:13.5px;
    color:var(--ui-text);
    background:#FAFAF8;
    border:1px solid var(--ui-border);
    border-radius:10px;
    padding:9px 10px;
    outline:none;
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{
    border-color:var(--shell-accent);
  }
  .field textarea{resize:none;line-height:1.5;}

  .date-row{display:flex;gap:8px;}
  .date-row select{flex:1;}

  /* 배경 투명도 슬라이더 */
  .opacity-row{display:flex;align-items:center;gap:10px;}
  .opacity-row input[type=range]{
    flex:1;
    -webkit-appearance:none;
    appearance:none;
    height:4px;
    border-radius:4px;
    background:var(--ui-border);
    outline:none;
  }
  .opacity-row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:var(--shell-accent);
    cursor:pointer;
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--shell-accent);
  }
  .opacity-row input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:var(--shell-accent);
    cursor:pointer;
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--shell-accent);
  }
  .opacity-row .opacity-value{
    width:38px;flex:none;text-align:right;
    font-size:12px;color:var(--ui-text-soft);
  }

  /* 방향/모드 토글 */
  .toggle-row{display:flex;gap:8px;flex-wrap:wrap;}
  .toggle-row.layout-grid{display:grid;grid-template-columns:1fr 1fr;}
  .toggle-btn{
    flex:1;
    padding:9px 0;
    text-align:center;
    font-size:13px;
    border:1px solid var(--ui-border);
    border-radius:10px;
    background:#FAFAF8;
    cursor:pointer;
    color:var(--ui-text-soft);
  }
  .toggle-btn.active{
    border-color:var(--shell-accent);
    color:var(--shell-accent);
    background:color-mix(in srgb, var(--shell-accent) 12%, white);
    font-weight:700;
  }

  /* 컬러 스와치 */
  .swatch-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .swatch{
    width:25px;height:25px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    position:relative;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
  }
  .swatch.active{border-color:var(--ui-text);}
  .swatch.custom{
    display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px dashed var(--ui-border);
    font-size:13px;color:var(--ui-text-soft);
    border-radius:50%;
  }
  .swatch input[type=color]{
    opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;
  }

  /* 사진 업로드 */
  .photo-upload-row{display:flex;align-items:center;gap:12px;}
  .photo-thumb{
    width:52px;height:52px;border-radius:50%;
    background:#F0EFEA;border:1px solid var(--ui-border);
    overflow:hidden;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb span{font-size:9.5px;color:var(--ui-text-soft);text-align:center;line-height:1.3;}
  input[type=file]{display:none;}
  .upload-btn{
    font-family:var(--font-main);
    font-size:12.5px;
    border:1px solid var(--ui-border);
    background:#FAFAF8;
    padding:8px 12px;
    border-radius:9px;
    cursor:pointer;
    color:var(--ui-text);
  }

  .hint-text{
    font-size:11px;
    color:var(--ui-text-soft);
    line-height:1.6;
    margin-top:10px;
  }

  .checkbox-row{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--ui-text);
    cursor:pointer;
  }
  .checkbox-row input{width:16px;height:16px;cursor:pointer;accent-color:var(--shell-accent);}

  /* ---------- 카드 목록 (인원수 관리) ---------- */
  .card-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .card-row{
    display:flex;align-items:center;gap:10px;
    padding:8px 9px;border-radius:12px;cursor:pointer;
    border:1.5px solid transparent;
    background:#FAFAF8;
  }
  .card-row:hover{background:#F1F0EB;}
  .card-row.active{
    background: color-mix(in srgb, var(--row-accent,#888) 12%, white);
    border-color: var(--row-accent,#ccc);
  }
  .card-row .thumb{
    width:32px;height:32px;border-radius:50%;flex:none;overflow:hidden;
    background:#eee;border:2px solid var(--row-accent,#ddd);
    display:flex;align-items:center;justify-content:center;font-size:9px;color:#999;
  }
  .card-row .thumb img{width:100%;height:100%;object-fit:cover;}
  .card-row .info{flex:1;min-width:0;}
  .card-row .info .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ui-text);}
  .card-row .info .meta{font-size:10px;color:var(--ui-text-soft);}
  .card-row .del{
    font-size:13px;color:var(--ui-text-soft);background:none;border:none;
    cursor:pointer;padding:3px 7px;border-radius:7px;flex:none;
  }
  .card-row .del:hover{background:#F3E2DF;color:#C1443A;}

  .add-card-btn{
    width:100%;padding:10px;border:1.5px dashed var(--ui-border);border-radius:12px;
    background:#FAFAF8;color:var(--ui-text-soft);font-size:12.5px;cursor:pointer;font-weight:600;
  }
  .add-card-btn:hover{background:#F0EFEA;color:var(--shell-accent);border-color:var(--shell-accent);}

  /* ---------- 구성원(그룹 모드) 편집 ---------- */
  .member-row{
    border:1px solid var(--ui-border);border-radius:12px;padding:10px 11px;
    margin-bottom:8px;background:#FAFAF8;
  }
  .member-top{display:flex;gap:6px;align-items:center;margin-bottom:7px;}
  .member-top input[type=text]{flex:1;}
  .rm-member{
    background:none;border:none;color:var(--ui-text-soft);cursor:pointer;
    font-size:13px;flex:none;padding:4px 6px;border-radius:6px;
  }
  .rm-member:hover{background:#F3E2DF;color:#C1443A;}
  .member-date-row{display:flex;gap:6px;}
  .member-date-row select{flex:1;font-size:12.5px;padding:7px 8px;}
  .add-member-btn{
    width:100%;padding:8px;border:1.5px dashed var(--ui-border);border-radius:10px;
    background:#fff;color:var(--ui-text-soft);font-size:12px;cursor:pointer;font-weight:600;
  }
  .add-member-btn:hover{background:#F0EFEA;color:var(--shell-accent);border-color:var(--shell-accent);}

  /* ---------- 미리보기 영역 ---------- */
  .preview-area{
    flex:1;
    overflow:auto;
    padding:44px 40px;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(0,0,0,0.035), transparent 50%),
      var(--ui-bg);
  }
  .preview-flow{display:flex; gap:38px;}
  .preview-flow.dir-portrait{flex-direction:row; align-items:flex-start;}
  .preview-flow.dir-landscape{flex-direction:column; align-items:center;}

  .page-slot{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;}
  .page-badge{
    font-family:var(--font-serif);
    font-style:italic;
    font-size:12px;
    color:var(--ui-text-soft);
    letter-spacing:0.02em;
  }

  /* ---------- 카드 프레임 (배경색 = 테두리처럼) ---------- */
  .card-frame{
    background:var(--cardbg);
    padding:16px;
    border-radius:34px;
    box-shadow:0 18px 42px rgba(20,24,40,0.18);
    flex:none;
  }

  /* ---------- 카드 본체 (다운로드 대상) ---------- */
  .card{
    position:relative;
    background:var(--paper);
    font-family:var(--font-main);
    color:var(--ink);
    padding:36px 28px 28px;
    width:360px;
    border-radius:24px;
    overflow:hidden;
  }
  .card.landscape{
    width:620px;
    display:grid;
    grid-template-columns:186px 1fr;
    gap:0 30px;
    align-items:start;
    padding:32px 34px;
  }

  .top-tag{
    font-family:var(--font-serif);font-style:italic;
    font-size:11px;color:var(--accent);opacity:0.8;
    letter-spacing:0.04em;margin-bottom:14px;
  }
  .card.landscape .top-tag{grid-column:1/3;margin-bottom:6px;}

  .profile-block{text-align:var(--talign, center);}
  .card.landscape .profile-block{text-align:var(--talign, left);padding-top:2px;}

  .photo-wrap{width:100px;height:100px;margin:0 auto 16px;position:relative;}
  .card.landscape .photo-wrap{margin:0 0 14px;}
  .photo-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent);pointer-events:none;}
  .photo-ring::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid var(--hairline);}
  .photo-circle-img{
    position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);
    border-radius:50%;object-fit:cover;display:block;background:var(--paper-deep);
  }
  .photo-circle-empty{
    position:absolute;inset:10px;border-radius:50%;
    background:var(--paper-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.4;
  }

  .card-name{
    font-size:21px;font-weight:700;color:var(--ink);
    margin-bottom:5px;word-break:keep-all;overflow-wrap:break-word;
  }
  .card-desc{
    font-size:12.5px;color:var(--ink-soft);line-height:1.6;
    word-break:keep-all;overflow-wrap:break-word;
  }

  /* 텍스트 정렬 기능: --talign(전체 기본)을 모든 텍스트가 따르되,
     --talign-name / --talign-desc / --talign-meta가 지정되면 해당 텍스트만 다른 정렬을 씀 */
  .card-name{
    text-align:var(--talign-name, var(--talign, inherit));
  }
  .card-desc{
    text-align:var(--talign-desc, var(--talign, inherit));
  }
  .card-date,
  .panel-name, .panel-kind, .meaning-label, .meaning-value,
  .mname, .mdate, .mi-kind, .mi-name, .mi-mean{
    text-align:var(--talign-meta, var(--talign, inherit));
  }

  .sprig-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0;}
  .card.landscape .profile-block .sprig-divider{justify-content:flex-start;margin:14px 0;}
  .sprig-divider .line{height:1px;flex:1;background:var(--hairline);}
  .card.landscape .profile-block .sprig-divider .line{max-width:40px;}
  .sprig-divider svg{width:16px;height:16px;color:var(--accent);opacity:0.85;flex:none;}

  .card-date{font-size:12px;color:var(--ink-soft);}
  .card-date b{color:var(--accent);font-weight:700;}

  /* 개인 모드 패널 (둥근 칩 스타일) */
  .panels{margin-top:20px;display:flex;flex-direction:column;gap:12px;}
  .card.landscape .panels{margin-top:0;}

  .panel{
    border-radius:18px;
    padding:15px 17px 14px;
  }
  .panel-head{display:flex;align-items:center;gap:11px;margin-bottom:9px;}
  .panel-icon{width:34px;height:34px;flex:none;}
  .panel-icon svg{width:100%;height:100%;display:block;}
  .panel-kind{font-size:10px;color:var(--accent);font-weight:700;margin-bottom:2px;letter-spacing:0.02em;}
  .panel-name{font-size:15.5px;font-weight:700;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;}

  .meaning-label{font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;}
  .meaning-value{font-size:13.5px;color:var(--ink);font-weight:600;word-break:keep-all;overflow-wrap:break-word;}

  /* ---------- 그룹 모드 ---------- */
  .group-photo-wrap{width:100px;height:100px;margin:0 auto 14px;position:relative;}
  .card.landscape .group-photo-wrap{margin:0 0 14px;}
  .group-caption{
    text-align:var(--talign-desc, var(--talign, center));font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;
  }
  .card.landscape .group-caption{text-align:var(--talign-desc, var(--talign, left));}

  .member-list{margin-top:18px;display:flex;flex-direction:column;gap:12px;}
  .card.landscape .member-list{margin-top:0;max-height:none;}

  .member-block{
    border-radius:20px;
    padding:14px 16px 15px;
  }
  .member-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .member-head .mname{font-size:15px;font-weight:700;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;}
  .member-head .mdate{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;}
  .member-mini{display:flex;gap:12px;}
  .mini-item{flex:1;min-width:0;display:flex;gap:7px;align-items:flex-start;}
  .mini-item .mi-icon{width:24px;height:24px;flex:none;margin-top:1px;}
  .mini-item .mi-icon svg{width:100%;height:100%;display:block;}
  .mini-item .mi-text{min-width:0;}
  .mini-item .mi-kind{font-size:9px;color:var(--accent);font-weight:700;letter-spacing:0.02em;}
  .mini-item .mi-name{font-size:12px;font-weight:700;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;line-height:1.3;}
  .mini-item .mi-mean{font-size:10px;color:var(--ink-soft);word-break:keep-all;overflow-wrap:break-word;line-height:1.35;margin-top:1px;}

  /* ---------- 사진 강조 레이아웃 (개인) ---------- */
  .photo-hero{
    width:100%;
    border-radius:20px;
    overflow:hidden;
    background:var(--paper-deep);
    margin-bottom:12px;
    border:1px solid var(--hairline);
  }
  .photo-hero.empty{
    aspect-ratio:4/3.1;
    display:flex;align-items:center;justify-content:center;
  }
  .photo-hero img{width:100%;height:auto;display:block;}
  .photo-hero span{font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.4;}

  /* ---------- 사진 강조 레이아웃: 가로형에서 사진 칸을 넉넉하게 ---------- */
  .card.landscape.layout-photo{width:680px;grid-template-columns:250px 1fr;}
  .card.landscape.layout-photo.group-photo-layout{width:760px;grid-template-columns:270px 1fr;}

  /* ---------- 전체 사진 레이아웃 (자유 배치) ---------- */
  .card.full-photo-layout{
    padding:0;
    aspect-ratio:3/4.1;
  }
  .card.landscape.full-photo-layout{
    display:block;
    grid-template-columns:none;
    width:620px;
    aspect-ratio:16/10.2;
    padding:0;
  }
  .full-photo-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .full-photo-bg-empty{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper-deep);color:var(--ink-soft);
    font-size:13px;text-align:center;line-height:1.5;
  }
  .card.full-photo-layout .top-tag{
    position:absolute;top:16px;left:20px;z-index:3;margin:0;
    background:rgba(255,255,255,0.6);padding:5px 11px;border-radius:8px;
  }
  .free-item{
    position:absolute;
    transform:translate(-50%,-50%);
    width:190px;
    background:rgba(251,246,236,0.95);
    border:1px solid rgba(255,255,255,0.7);
    border-radius:14px;
    padding:11px 14px;
    cursor:grab;
    box-shadow:0 8px 22px rgba(15,15,20,0.22);
    z-index:2;
    touch-action:none;

  .free-item.member-free-item .member-head{margin-bottom:8px;}
  .free-item.member-free-item .mname{font-size:12.5px;}
  .free-item.member-free-item .mdate{font-size:9.5px;}

  .card.center-photo-layout.landscape{
    width:720px;
    display:grid;
    grid-template-columns:1fr 220px 1fr;
    grid-template-rows:1fr 1fr;
    gap:14px;
    padding:30px;
  }
  .card.center-photo-layout.landscape .top-tag{grid-column:1/4;margin-bottom:2px;}
  .center-photo-hero{
    grid-column:2;grid-row:1/3;
    border-radius:20px;overflow:hidden;
    background:var(--paper-deep);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }

    flex:none;width:100%;box-sizing:border-box;
    padding:8px 10px;font-size:10.5px;line-height:1.4;
    color:#fff;text-align:var(--talign-desc, var(--talign, center));word-break:keep-all;overflow-wrap:break-word;
    background:rgba(15,15,20,0.42);
  }

    border-radius:16px;
    padding:14px 15px;
    display:flex;flex-direction:column;justify-content:center;
    min-width:0;
  }

  .center-quad.bl{grid-column:1;grid-row:2;}
  .center-quad.tr{grid-column:3;grid-row:1;}
  .center-quad.br{grid-column:3;grid-row:2;}
  .center-quad.empty-quad{padding:0;}
  .center-quad .card-name{font-size:16px;margin-bottom:4px;}
  .center-quad .card-desc{font-size:11.5px;}
  .center-quad .card-date{font-size:12px;}
  .center-quad .panel-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
  .center-quad .panel-icon{width:26px;height:26px;flex:none;}
  .center-quad .panel-icon svg{width:100%;height:100%;display:block;}
  .center-quad .panel-kind{font-size:9px;color:var(--accent);font-weight:700;margin-bottom:1px;}
  .center-quad .panel-name{font-size:13.5px;font-weight:700;color:var(--ink);word-break:keep-all;overflow-wrap:break-word;}
  .center-quad .meaning-label{font-size:9.5px;color:var(--ink-soft);margin-bottom:2px;}
  .center-quad .meaning-value{font-size:11.5px;color:var(--ink);font-weight:600;word-break:keep-all;overflow-wrap:break-word;}

  .center-quad.member-quad .mname{font-size:13.5px;}
  .center-quad.member-quad .mdate{font-size:10px;}
  .center-quad.member-quad .member-mini{gap:8px;}
  .center-quad.member-quad .mi-name{font-size:11px;}

  .edit-photo-btn{

    padding:8px 12px;
    border-radius:9px;
    cursor:pointer;

  .edit-photo-btn:hover{background:#F0EFEA;}
  .edit-photo-btn.danger{color:#B3432E;}
  .edit-photo-btn.danger:hover{background:#FBEAE6;}

  /* ---------- 이미지 크롭 모달 ---------- */
  .crop-modal-overlay{

    z-index:999;padding:20px;

  .crop-modal{

  .crop-modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--ui-border);
    font-size:14px;font-weight:700;color:var(--ui-text);flex:none;
  }
  .crop-close{background:none;border:none;font-size:15px;color:var(--ui-text-soft);cursor:pointer;padding:4px 6px;}
  .crop-modal-body{
    background:#111214;
    height:min(58vh,420px);
    flex:none;
    position:relative;
  }
  .crop-image-wrap{width:100%;height:100%;}
  .crop-image-wrap img{max-width:100%;display:block;}
  .crop-modal-controls{padding:14px 18px;flex:none;border-bottom:1px solid var(--ui-border);}
  .crop-aspect-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}

  .crop-tool-btn{
    font-family:var(--font-main);font-size:13px;padding:7px 12px;border-radius:9px;
    border:1px solid var(--ui-border);background:#FAFAF8;color:var(--ui-text);cursor:pointer;
  }
  .crop-tool-btn:hover{background:#F0EFEA;}
  .crop-modal-footer{
    display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;flex:none;
  }

  @media (max-width:900px){

    body{

      height:auto;

      display:block;

    .app-shell{

      min-height:100vh;
      min-height:100dvh;
      height:auto;
      overflow:visible;
      box-shadow:none;

    .field input[type=text], .field textarea, .field select{font-size:16px;}
  }

  @media (max-width:480px){
    .preview-flow{gap:26px;}
    .preview-flow.dir-portrait{flex-direction:column;align-items:center;}

const PAPER_HEX = '#FBF6EC';

// html2canvas가 CSS color-mix()를 안정적으로 처리하지 못하는 경우가 있어
// 배경/테두리 색을 JS에서 직접 계산한 rgb(a) 값으로 만들어 인라인 스타일로 적용한다.
function hexToRgb(hex){
  hex = hex.replace('#','').trim();
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function mixWithBase(hex, pct, baseHex){
  const a = hexToRgb(hex);
  const b = hexToRgb(baseHex);
  const t = pct/100;
  const r = Math.round(a.r*t + b.r*(1-t));
  const g = Math.round(a.g*t + b.g*(1-t));
  const bl = Math.round(a.b*t + b.b*(1-t));
  return `rgb(${r}, ${g}, ${bl})`;
}
function accentAlpha(hex, pct){
  const a = hexToRgb(hex);
  return `rgba(${a.r}, ${a.g}, ${a.b}, ${(pct/100).toFixed(3)})`;
}
function rgbToRgba(rgbStr, alpha){
  const m = rgbStr.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if(!m) return rgbStr;
  return `rgba(${m[1]}, ${m[2]}, ${m[3]}, ${alpha.toFixed(3)})`;
}
function tintStyle(accent, bgPct, borderPct, opacityPct){
  const op = (opacityPct===undefined || opacityPct===null) ? 1 : opacityPct/100;
  const bg = mixWithBase(accent, bgPct, PAPER_HEX);
  const bgRgba = rgbToRgba(bg, op);
  const border = accentAlpha(accent, borderPct*op);
  return `background:${bgRgba};border:1px solid ${border};`;
}

function newCard(){
  const c = {
    id:uid(),
    mode:'single',          // 'single' | 'group'
    layout:'default',       // 'default' | 'photo' | 'full' | 'center'
    showTag:true,
    accent: ACCENT_SWATCHES[state.cards.length % ACCENT_SWATCHES.length] || ACCENT_SWATCHES[0],
    bg: BG_SWATCHES[state.cards.length % BG_SWATCHES.length] || BG_SWATCHES[0],
    photo:null,
    photoOriginal:null,
    photoDispW:null,
    photoDispH:null,
    photoOpacity:100,       // 사진 자체의 투명도(0~100). 100=원본 그대로
    desc:'',
    textAlign:null,         // 전체 기본 정렬: null(레이아웃 기본) | 'left' | 'center' | 'right'
    textAlignName:null,     // 이름 텍스트만 다른 정렬을 쓰고 싶을 때 (null이면 전체 기본 정렬을 따름)
    textAlignDesc:null,     // 소개/설명 텍스트만 다른 정렬
    textAlignMeta:null,     // 생일·탄생화·탄생석 등 정보 텍스트만 다른 정렬
    freeOpacity:{},         // 전체 사진 레이아웃 상자별 배경 투명도(0~100)
    members:[ newMember() ]
  };
  return c;
}

function getFreeOpacity(card, key){
  if(!card.freeOpacity) card.freeOpacity = {};
  if(card.freeOpacity[key]===undefined) card.freeOpacity[key] = 95;
  return card.freeOpacity[key];
}
function setFreeOpacity(card, key, val){
  if(!card.freeOpacity) card.freeOpacity = {};
  card.freeOpacity[key] = val;
}

function getOpacityFields(card){
  if(card.layout==='full'){
    return card.mode==='single'
      ? [
          {label:'이름+소개 상자', key:'name'},
          {label:'생일+탄생석+탄생화 상자', key:'info'}
        ]
      : [
          {label:'그룹 설명 상자', key:'desc'},
          {label:'구성원 상자', key:'members'}
        ];
  }
  if(card.layout==='center'){
    return card.mode==='single'
      ? [
          {label:'이름·생일 상자', key:'quadTop'},
          {label:'탄생화·탄생석 상자', key:'quadBottom'}
        ]
      : [
          {label:'구성원 상자', key:'centerMembers'}
        ];
  }
  // 기본 / 사진 강조 레이아웃
  return card.mode==='single'
    ? [{label:'탄생화·탄생석 상자', key:'panels'}]
    : [{label:'구성원 상자', key:'memberBlocks'}];
}
function opacityFieldHTML(label, card, key){
  const v = getFreeOpacity(card, key);
  return `
    <div class="field">

      <div class="opacity-row">
        <input type="range" class="opacity-range-input" data-opacity-key="${key}" min="0" max="100" value="${v}">
        <span class="opacity-value" data-opacity-value-for="${key}">${v}%</span>
      </div>
    </div>
  `;
}

function getDefaultCropRatio(card){
  return (card.layout==='photo' || card.layout==='full') ? 'free' : '1';
}

let cropperInstance = null;
let cropTargetCard = null;

function openCropModal(card, srcDataUrl, defaultRatio){
  cropTargetCard = card;
  const overlay = document.getElementById('cropModalOverlay');
  const imgEl = document.getElementById('cropImageEl');

  document.querySelectorAll('.crop-aspect-btn').forEach(b=>b.classList.remove('active'));
  const defBtn = document.querySelector(`.crop-aspect-btn[data-ratio="${defaultRatio}"]`) || document.querySelector('.crop-aspect-btn[data-ratio="free"]');
  if(defBtn) defBtn.classList.add('active');

  if(cropperInstance){ cropperInstance.destroy(); cropperInstance = null; }

  overlay.classList.add('show');
  imgEl.onload = ()=>{
    cropperInstance = new Cropper(imgEl, {
      viewMode:1,
      aspectRatio: defaultRatio==='free' ? NaN : parseFloat(defaultRatio),
      background:false,
      autoCropArea:0.95,
      zoomable:true,
      movable:true,
      responsive:true
    });
  };
  imgEl.src = srcDataUrl;
}

function closeCropModal(){
  document.getElementById('cropModalOverlay').classList.remove('show');
  if(cropperInstance){ cropperInstance.destroy(); cropperInstance = null; }
  cropTargetCard = null;
}

document.getElementById('cropCloseBtn').addEventListener('click', closeCropModal);
document.getElementById('cropCancelBtn').addEventListener('click', closeCropModal);

document.querySelectorAll('.crop-aspect-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.crop-aspect-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(!cropperInstance) return;
    const r = btn.dataset.ratio;
    cropperInstance.setAspectRatio(r==='free' ? NaN : parseFloat(r));
  });
});

document.getElementById('cropZoomInBtn').addEventListener('click', ()=>{ if(cropperInstance) cropperInstance.zoom(0.1); });
document.getElementById('cropZoomOutBtn').addEventListener('click', ()=>{ if(cropperInstance) cropperInstance.zoom(-0.1); });
document.getElementById('cropRotateLeftBtn').addEventListener('click', ()=>{ if(cropperInstance) cropperInstance.rotate(-90); });
document.getElementById('cropRotateRightBtn').addEventListener('click', ()=>{ if(cropperInstance) cropperInstance.rotate(90); });
document.getElementById('cropResetBtn').addEventListener('click', ()=>{ if(cropperInstance) cropperInstance.reset(); });

document.getElementById('cropApplyBtn').addEventListener('click', ()=>{
  if(!cropperInstance || !cropTargetCard) return;
  const canvas = cropperInstance.getCroppedCanvas({maxWidth:1600, maxHeight:1600, imageSmoothingQuality:'high'});
  if(!canvas){ closeCropModal(); return; }
  // PNG로 저장해 업로드한 이미지의 투명(알파) 배경이 그대로 유지되도록 함 (JPEG는 투명 영역을 흰색으로 채워버림)
  const dataUrl = canvas.toDataURL('image/png');
  cropTargetCard.photo = dataUrl;
  // 전체 사진 레이아웃: 사진 원본 비율만큼 카드 크기가 자동으로 늘어나거나 줄어들도록 저장
  const TARGET_LONG_EDGE = 560;
  const scale = TARGET_LONG_EDGE / Math.max(canvas.width, canvas.height);
  cropTargetCard.photoDispW = Math.round(canvas.width * scale);
  cropTargetCard.photoDispH = Math.round(canvas.height * scale);
  closeCropModal();
  renderCardEditor(); renderCardList(); renderPreview();
});

// ============ 자유 배치(전체 사진 레이아웃) 드래그 ============
function wireFreeDrag(){
  document.querySelectorAll('.card.full-photo-layout').forEach(cardEl=>{
    const cardId = cardEl.id.replace('cardEl-','');
    const card = state.cards.find(c=>c.id===cardId);
    if(!card) return;
    cardEl.querySelectorAll('.free-item').forEach(item=>{
      const key = item.dataset.freeKey;
      let dragging = false;

      const onMove = (e)=>{
        if(!dragging) return;
        const rect = cardEl.getBoundingClientRect();
        let xPct = ((e.clientX - rect.left) / rect.width) * 100;
        let yPct = ((e.clientY - rect.top) / rect.height) * 100;
        xPct = Math.min(92, Math.max(8, xPct));
        yPct = Math.min(94, Math.max(6, yPct));
        item.style.left = xPct + '%';
        item.style.top = yPct + '%';
        getFreePos(card)[key] = {x:xPct, y:yPct};
      };
      const onUp = (e)=>{
        if(!dragging) return;
        dragging = false;
        try{ item.releasePointerCapture(e.pointerId); }catch(err){}
      };
      item.addEventListener('pointerdown', (e)=>{
        dragging = true;
        try{ item.setPointerCapture(e.pointerId); }catch(err){}
      });
      item.addEventListener('pointermove', onMove);
      item.addEventListener('pointerup', onUp);
      item.addEventListener('pointercancel', onUp);
    });
  });
}

function getSelectedCard(){
  return state.cards.find(c=>c.id===state.selectedId) || state.cards[0];
}
function fillDayOptions(selectEl, month, curDay){
  const max = MONTH_DAYS[month-1];
  selectEl.innerHTML='';
  for(let d=1; d<=max; d++){
    const opt=document.createElement('option');
    opt.value=d; opt.textContent=d+'일';
    selectEl.appendChild(opt);
  }
  selectEl.value = Math.min(curDay, max);
  return Math.min(curDay, max);
}

// ============ 사이드바: 카드(인원) 목록 ============
function renderCardList(){
  const wrap = document.getElementById('cardListEl');
  wrap.innerHTML = '';
  state.cards.forEach((card, idx)=>{
    const row = document.createElement('div');
    row.className = 'card-row' + (card.id===state.selectedId ? ' active' : '');
    row.style.setProperty('--row-accent', card.bg);
    const mainName = card.members[0] && card.members[0].name ? card.members[0].name : ('인원 '+(idx+1));
    const metaText = card.mode==='group' ? `그룹 · ${card.members.length}명` : '개인 카드';
    row.innerHTML = `
      <div class="thumb">${card.photo ? `<img src="${card.photo}">` : ''}</div>
      <div class="info">
        <div class="nm">${escapeHtml(mainName)}</div>
        <div class="meta">${metaText}</div>
      </div>
      <button class="del" title="삭제" ${state.cards.length<=1?'disabled':''}>✕</button>
    `;
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.del')) return;
      state.selectedId = card.id;
      renderAll();
    });
    row.querySelector('.del').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(state.cards.length<=1) return;
      const i = state.cards.findIndex(c=>c.id===card.id);
      state.cards.splice(i,1);
      if(state.selectedId===card.id){
        state.selectedId = state.cards[Math.max(0,i-1)].id;
      }
      renderAll();
    });
    wrap.appendChild(row);
  });
  document.getElementById('cardCountLabel').textContent = state.cards.length+'명';
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getFreePos(card){
  if(!card.freePos) card.freePos = {};
  return card.freePos;
}
function ensurePos(card, key, x, y){
  const fp = getFreePos(card);
  if(!fp[key]) fp[key] = {x, y};
  return fp[key];
}
function getFreeSize(card, key, defaultW, defaultH){
  if(!card.freeSize) card.freeSize = {};
  if(!card.freeSize[key]) card.freeSize[key] = {w:defaultW, h:defaultH};
  return card.freeSize[key];
}
function freeItemStyleAttr(size){
  let s = `width:${size.w}px;`;
  if(size.h) s += `height:${size.h}px;`;
  return s;
}
// 카드에 올라간 사진 자체의 투명도(0~100 → CSS opacity 0~1)를 반환. 모든 레이아웃의 <img>에 공통 적용.
function photoOpacityValue(card){
  const v = (card.photoOpacity===undefined || card.photoOpacity===null) ? 100 : card.photoOpacity;
  return v/100;
}
function buildCardHTML(card, landscape){
  const cls = 'card' + (landscape ? ' landscape' : '');
  const styleVars = `--accent:${card.accent};--cardbg:${card.bg};${card.textAlign ? `--talign:${card.textAlign};` : ''}${card.textAlignName ? `--talign-name:${card.textAlignName};` : ''}${card.textAlignDesc ? `--talign-desc:${card.textAlignDesc};` : ''}${card.textAlignMeta ? `--talign-meta:${card.textAlignMeta};` : ''}`;
  // 전체 사진 레이아웃: 업로드한 사진의 원본 비율만큼 카드 크기가 자유롭게 늘어나거나 줄어듦

      const m = card.members[0];

      const posName = ensurePos(card,'name',26,83);

      return `

            <div class="card-desc">${escapeHtml(card.desc) || '소개를 입력하면 여기에 표시돼요'}</div>
          </div>

                <div class="mi-kind">탄생석</div>

    } else {
      const opDesc = getFreeOpacity(card,'desc');
      const opMembers = getFreeOpacity(card,'members');
      const memberItems = buildFreeMemberItemsHTML(card, opMembers);

            </div>
            <div class="member-mini">
              <div class="mini-item">

// ============ 미리보기 렌더 ============
function renderPreview(){
  document.documentElement.style.setProperty('--font-main', FONT_MAP[state.font]);

  const flow = document.getElementById('previewFlow');
  flow.className = 'preview-flow ' + (state.orientation==='landscape' ? 'dir-landscape' : 'dir-portrait');
  flow.innerHTML = '';

  state.cards.forEach((card, idx)=>{
    const slot = document.createElement('div');
    slot.className = 'page-slot';
    const badge = document.createElement('div');
    badge.className = 'page-badge';
    const label = card.members[0] && card.members[0].name ? card.members[0].name : ('page.'+(idx+1));
    badge.textContent = `${String(idx+1).padStart(2,'0')} — ${label}`;
    const frame = document.createElement('div');
    frame.className = 'card-frame';
    frame.style.setProperty('--cardbg', card.bg);
    frame.innerHTML = buildCardHTML(card, state.orientation==='landscape');
    slot.appendChild(badge);
    slot.appendChild(frame);
    flow.appendChild(slot);
  });

  wireFreeDrag();
  fitPreviewToViewport();
}

// ============ 모바일 좁은 화면에서 카드가 잘리지 않게 자동 축소 ============
function fitPreviewToViewport(){
  const previewArea = document.querySelector('.preview-area');
  const frames = document.querySelectorAll('.card-frame');
  if(!previewArea || !frames.length) return;

  const isNarrow = window.innerWidth <= 900;

  frames.forEach(frame=>{
    frame.style.zoom = ''; // 자연 크기로 먼저 리셋해서 측정
  });

  if(!isNarrow) return;

  const availWidth = previewArea.clientWidth - 24; // 좌우 여백 감안
  frames.forEach(frame=>{
    const natural = frame.scrollWidth;
    if(natural > availWidth && natural > 0){
      const scale = Math.max(0.45, availWidth / natural);
      frame.style.zoom = scale;
    }
  });
}

let fitResizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(fitResizeTimer);
  fitResizeTimer = setTimeout(fitPreviewToViewport, 120);
});

// ============ 다운로드 ============
function waitForImages(el){
  const imgs = Array.from(el.querySelectorAll('img'));
  return Promise.all(imgs.map(img=>{
    if(img.complete && img.naturalWidth > 0) return Promise.resolve();
    return new Promise(resolve=>{
      img.addEventListener('load', resolve, {once:true});
      img.addEventListener('error', resolve, {once:true});
    });
  }));
}

async function captureCard(card){
  const el = document.getElementById('cardEl-'+card.id).closest('.card-frame');
  document.body.classList.add('is-exporting');
  // 모바일에서 미리보기 축소(zoom)를 적용해뒀다면, 캡처 전엔 원본 크기로 되돌려야
  // 저장되는 이미지 화질이 낮아지지 않음
  const prevZoom = el.style.zoom;
  el.style.zoom = '';
  try{
    // 이미지가 완전히 로드된 뒤에 캡처해야 사진이 빠지는 문제가 생기지 않음
    await waitForImages(el);
    // 브라우저 렌더링/디코딩이 끝날 시간을 한 프레임 더 확보
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const canvas = await html2canvas(el, {
      backgroundColor:null,
      scale:3,
      useCORS:true,
      allowTaint:true,
      imageTimeout:15000
    });
    return canvas;
  } finally {
    el.style.zoom = prevZoom;
    document.body.classList.remove('is-exporting');
  }
}

function canvasToBlob(canvas){
  return new Promise(resolve=> canvas.toBlob(resolve, 'image/png'));
}

document.getElementById('downloadOneBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadOneBtn');
  const card = getSelectedCard();
  const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
  btn.disabled = true; btn.textContent = '저장 중...';
  try{
    const canvas = await captureCard(card);
    const fname = ((card.members[0] && card.members[0].name) || '캐릭터').replace(/[\\/:*?"<>|]/g,'');
    const blob = await canvasToBlob(canvas);
    const file = new File([blob], `${fname}_탄생카드.png`, {type:'image/png'});

    // 모바일: 공유 시트를 지원하면 "사진에 저장"으로 바로 연결됨 (가장 안정적)
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:`${fname}_탄생카드`});
    }
    // 공유 시트를 지원하지 않는 모바일 브라우저(구형 iOS 사파리 등): 새 탭에 이미지를 열어
    // 길게 눌러 저장할 수 있게 안내
    else if(isTouchDevice){
      const dataUrl = canvas.toDataURL('image/png');
      const win = window.open();
      if(win){
        win.document.write(`<title>${fname}_탄생카드</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;"><img src="${dataUrl}" style="max-width:100%;height:auto;"></body>`);
      } else {
        alert('팝업이 차단되었어요. 팝업 허용 후 다시 시도해주세요.');
      }
      alert('이미지를 길게 눌러 "사진에 저장"을 선택해주세요.');
    }
    // 데스크톱: 기존 방식대로 바로 다운로드
    else {
      const link = document.createElement('a');
      link.download = `${fname}_탄생카드.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  }catch(err){
    // 사용자가 공유 시트를 취소한 경우(AbortError)는 에러 알림을 띄우지 않음
    if(err && err.name !== 'AbortError'){
      alert('이미지 저장에 실패했어요. 다시 시도해주세요.');
    }
  }
  btn.disabled = false; btn.textContent = '이미지로 저장';
});

renderAll();
</script>
</body>
</html>
